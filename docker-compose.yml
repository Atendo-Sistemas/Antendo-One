version: '3.8'

services:
  # ============================================================================
  # BANCO DE DADOS RELACIONAL SQL (POSTGRESQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: atendo-one-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - atendo-one-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # APLICAÇÃO ELO LOG (SAAS MULTI-TENANT + COMPRESSÃO DE IMAGENS)
  # ============================================================================
  atendo-one:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atendo-one-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # APP_PORT controla a porta externa; PORT controla a porta interna da aplicação.
      - "${APP_PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # Conexão com o banco SQL PostgreSQL
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DATABASE_URL=postgresql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}
      # app_state permanece em transição; só ativar após migração relacional validada.
      - RLS_DOMAIN_MODE=${RLS_DOMAIN_MODE:-snapshot}
      - NORMALIZED_DOMAIN_RLS=${NORMALIZED_DOMAIN_RLS:-false}
      # Compressão Automática de Imagens
      - IMAGE_COMPRESSION_ENABLED=true
      - IMAGE_QUALITY=0.8
      - IMAGE_MAX_WIDTH=1600
      - IMAGE_MAX_HEIGHT=1600
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CONFIG_ENCRYPTION_KEY_FILE=/run/secrets/elolog_config_encryption_key
    secrets:
      - elolog_config_encryption_key
    networks:
      - atendo-one-network
      # Caso use um proxy reverso global rodando em outra rede, descomente a rede abaixo:
      # - proxy-network

networks:
  atendo-one-network:
    name: atendo-one-network
    driver: bridge
  # Caso use rede externa para conectar com Nginx Proxy Manager, Traefik ou Caddy, descomente abaixo:
  # proxy-network:
  #   external: true

volumes:
  postgres_data:
    name: elo_log_postgres_data
secrets:
  elolog_config_encryption_key:
    external: true
